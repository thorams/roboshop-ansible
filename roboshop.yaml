- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    thorams: ["catalogue", "user", "cart", "shipping", "payment", "frontend"]
    action: create
    domain_name: thorams.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create SGs
    amazon.aws.ec2_security_group:
      name: "thorams-{{ item }}"
      state: present
      description: "thorams-{{ item }}-SG"
      region: us-east-1
    loop: "{{ thorams }}"
    when: action == "create"
    register: SG_output

  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "thorams-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - thorams-common
      - "thorams-{{ item }}"
      region: us-east-1
    loop: "{{ thorams }}"
    when: action == "create"
    register: ec2_output

  # - name: print ec2 creation output
  #   debug:
  #     msg: "{{ ec2_output }}"

  - name: create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" # mongodb.daws92s.store
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  

  

  