- name: configure redis server
  hosts: redis
  become: yes
  tasks:
  - name: enable redis 7
    command: dnf module enable redis:7 -yes
  - name: install redis
    package:
      name: redis
      state: present
  - name: allow remote connections
    replace:
      name: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: disble protect module
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protected-mode yes'
      line: 'protected-mode no'
  - name: start redis services and enable
    service:
      name: redis
      state: restarted
      enabled: yes